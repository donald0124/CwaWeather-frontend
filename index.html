<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>氣象・臺灣</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* 侘寂配色 Wabi-Sabi Palette */
            --bg-paper: #F2F0EB;    /* 生成色 - 紙張 */
            --ink-dark: #3F3931;    /* 墨色 - 文字 */
            --ink-light: #8E8B82;   /* 鈍色 - 次要文字 */
            --map-base: #E0DCD5;    /* 素鼠 - 地圖底色 */
            --map-active: #7A8F70;  /* 柳染 - 選中色 (低飽和綠) */
            --accent-red: #B85948;  /* 弁柄色 - 重點 (印章感) */
            --border: #D1CEC5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Shippori Mincho', serif; /* 日式明體 */
            background-color: var(--bg-paper);
            color: var(--ink-dark);
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* 禁止滑動 */
            display: flex;
            justify-content: center;
            align-items: center;
            /* 模擬和紙紋理 */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
        }

        /* === 標題區 (直書) === */
        .title-area {
            position: absolute;
            top: 30px;
            right: 25px;
            writing-mode: vertical-rl; /* 直書模式 */
            z-index: 10;
            letter-spacing: 0.3em;
            pointer-events: none;
        }

        .main-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--ink-dark);
            border-right: 1px solid var(--ink-dark); /* 右側裝飾線 */
            padding-right: 15px;
        }

        .sub-title {
            font-size: 0.9rem;
            color: var(--ink-light);
            margin-right: 10px;
            margin-top: 10px;
        }

        /* === 資訊顯示區 (左下角，不擋地圖) === */
        .info-panel {
            position: absolute;
            bottom: 40px;
            left: 30px;
            z-index: 20;
            opacity: 0; /* 預設隱藏 */
            transition: opacity 0.8s ease;
            max-width: 200px;
        }

        .info-panel.visible {
            opacity: 1;
        }

        .city-name {
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 5px;
            position: relative;
            display: inline-block;
        }

        /* 紅色印章裝飾 */
        .city-name::after {
            content: '';
            position: absolute;
            top: 0;
            right: -15px;
            width: 10px;
            height: 10px;
            background: var(--accent-red);
            border-radius: 50%;
            opacity: 0.8;
        }

        .weather-detail {
            font-size: 1rem;
            color: var(--ink-dark);
            line-height: 1.8;
            margin-top: 10px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .temp-display {
            font-size: 1.4rem;
            margin-top: 5px;
        }

        .meta-row {
            font-size: 0.85rem;
            color: var(--ink-light);
            margin-top: 5px;
        }

        /* === 全版地圖 === */
        .map-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            height: 100%; /* 讓地圖盡量大，留一點上下邊距 */
            width: 100%;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.05)); /* 極淡的陰影 */
        }

        /* 地圖路徑樣式 */
        path {
            fill: var(--map-base);
            stroke: #F9F7F2; /* 邊線用接近背景的色 */
            stroke-width: 1.5;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        path:hover {
            fill: #C5C0B5; /* Hover 時稍微變深 */
        }

        path.active {
            fill: var(--map-active);
            stroke: var(--bg-paper);
        }

        /* 離島文字標籤 (選擇性) */
        text {
            fill: var(--ink-light);
            font-size: 10px;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-paper);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        .loading-text {
            writing-mode: vertical-rl;
            letter-spacing: 0.5em;
            color: var(--ink-light);
            font-size: 1.2rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">
        <div class="loading-text">氣息讀取中...</div>
    </div>

    <div class="title-area">
        <div class="main-title">臺灣氣象帖</div>
        <div id="dateTag" class="sub-title"></div>
    </div>

    <div id="infoPanel" class="info-panel">
        <div id="panelCity" class="city-name">--</div>
        <div class="weather-detail">
            <div id="panelWeather">請點選地圖</div>
            <div class="temp-display"><span id="panelTemp">--</span>°C</div>
            <div class="meta-row">
                降雨 <span id="panelRain">--</span> | <span id="panelDesc">--</span>
            </div>
        </div>
    </div>

    <div class="map-container">
        <svg id="taiwanMap" viewBox="0 0 500 750" preserveAspectRatio="xMidYMid meet">
            <path id="連江縣" d="M80 60 L100 50 L110 70 L90 80 Z" />
            <text x="80" y="45">連江</text>

            <path id="金門縣" d="M40 350 L70 340 L80 370 L50 380 Z" />
            <text x="40" y="335">金門</text>

            <path id="澎湖縣" d="M80 450 L120 440 L130 480 L90 490 Z" />
            <text x="90" y="510">澎湖</text>

            <path id="基隆市" d="M380 40 L395 35 L400 45 L390 50 Z" />
            <path id="臺北市" d="M360 55 L380 50 L390 65 L370 75 Z" />
            <path id="新北市" d="M350 40 L360 50 L370 75 L390 65 L405 85 L340 65 Z" />
            <path id="桃園市" d="M330 55 L350 40 L340 65 L320 75 Z" />
            <path id="新竹市" d="M315 75 L325 75 L325 85 L315 85 Z" />
            <path id="新竹縣" d="M310 75 L330 70 L340 90 L320 95 Z" />
            <path id="苗栗縣" d="M300 85 L320 80 L330 110 L290 120 Z" />

            <path id="臺中市" d="M290 110 L330 100 L340 145 L280 155 Z" />
            <path id="彰化縣" d="M270 145 L290 140 L290 165 L270 165 Z" />
            <path id="南投縣" d="M300 145 L350 135 L340 200 L300 190 Z" />
            <path id="雲林縣" d="M260 165 L290 165 L290 190 L260 190 Z" />

            <path id="嘉義市" d="M280 195 L290 195 L290 205 L280 205 Z" />
            <path id="嘉義縣" d="M260 190 L300 190 L300 220 L260 210 Z" />
            <path id="臺南市" d="M250 210 L290 210 L280 250 L240 240 Z" />
            <path id="高雄市" d="M250 240 L300 230 L310 295 L260 295 Z" />
            <path id="屏東縣" d="M270 295 L310 295 L310 380 L290 410 L270 370 Z" />

            <path id="宜蘭縣" d="M380 65 L420 85 L400 120 L360 85 Z" />
            <path id="花蓮縣" d="M360 120 L400 120 L380 240 L340 200 Z" />
            <path id="臺東縣" d="M320 240 L360 240 L340 360 L310 295 Z" />
        </svg>
    </div>

    <script>
        const API_URL = "https://cwa-backend.zeabur.app/api/weather/all";
        let allWeatherData = {}; 

        // 啟動時設定日期
        function setDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            // 轉換成稍微日式的寫法
            document.getElementById('dateTag').innerText = `${year}年 ${month}月${date}日`;
        }

        async function init() {
            setDate();
            try {
                // 模擬讀取氛圍
                await new Promise(r => setTimeout(r, 1200));

                const response = await fetch(API_URL);
                const json = await response.json();

                if (json.success) {
                    // 建立對照表
                    json.data.locations.forEach(location => {
                        allWeatherData[location.city] = location;
                    });
                    
                    // 淡出 Loading
                    const loading = document.getElementById('loading');
                    loading.style.opacity = '0';
                    setTimeout(() => loading.style.display = 'none', 500);

                    // 綁定互動
                    bindInteractions();
                }
            } catch (error) {
                console.error(error);
                document.querySelector('.loading-text').innerText = "連線異常";
            }
        }

        function bindInteractions() {
            const paths = document.querySelectorAll('path');
            const panel = document.getElementById('infoPanel');

            paths.forEach(path => {
                path.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const cityName = path.id;

                    // 1. 視覺狀態更新
                    paths.forEach(p => p.classList.remove('active'));
                    path.classList.add('active');

                    // 2. 顯示資訊
                    showWeatherInfo(cityName);
                });
            });

            // 點擊背景重置
            document.addEventListener('click', (e) => {
                if(e.target.tagName !== 'path') {
                    paths.forEach(p => p.classList.remove('active'));
                    panel.classList.remove('visible');
                }
            });
        }

        function showWeatherInfo(city) {
            const data = allWeatherData[city];
            if (!data) return;

            const current = data.forecasts[0];
            const panel = document.getElementById('infoPanel');
            
            // 填入資料
            document.getElementById('panelCity').innerText = city;
            document.getElementById('panelWeather').innerText = current.weather;
            
            // 計算平均溫
            const avgTemp = Math.round((parseInt(current.minTemp) + parseInt(current.maxTemp)) / 2);
            document.getElementById('panelTemp').innerText = avgTemp;
            
            document.getElementById('panelRain').innerText = current.rain;
            
            // 簡單的舒適度或體感描述轉換
            let desc = "舒適";
            if(current.weather.includes("雨")) desc = "帶傘";
            if(parseInt(current.maxTemp) > 28) desc = "炎熱";
            if(parseInt(current.minTemp) < 18) desc = "涼意";
            
            document.getElementById('panelDesc').innerText = desc;

            // 顯示面板 (Fade In)
            panel.classList.add('visible');
        }

        // 開始
        init();

    </script>
</body>
</html>
